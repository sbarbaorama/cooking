<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ricettario</title>
  <meta name="description" content="Il tuo ricettario personale: salva ricette, gestisci dispensa e spesa, pianifica i pasti.">
  <meta name="theme-color" content="#143f5e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Applica il tema salvato prima del rendering per evitare lampeggi
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <nav class="nav" id="nav" aria-label="Navigazione principale">

        <img src="icons/icon.svg" alt="" width="38" height="38">

      </div>
      <a href="#/" data-nav="recipes"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg></span><span class="lbl">Ricette</span></a>

          <span class="sync-dot" id="sync-dot"></span><span id="sync-label">Locale</span>

        <a class="app-ver" id="app-ver" href="#/settings?focus=ver" title="Versione dell'app"></a>
